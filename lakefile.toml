name = "formalizedQuantumComputing"
version = "0.1.0"
keywords = ["math", "quantum-computing", "formalization"]
defaultTargets = ["FormalizedQuantumComputing"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[lean_lib]]
name = "FormalizedQuantumComputing"
